services:
  yingxu:
    build: .
    ports:
      - "127.0.0.1:8770:8770"
    environment:
      HOST: 0.0.0.0
      PORT: 8770
      CHENYU_CARD_URL: ${CHENYU_CARD_URL:-}
      YINGXU_DATA_DIR: /app/private
      YINGXU_ALLOWED_ORIGINS: ${YINGXU_ALLOWED_ORIGINS:-}
    volumes:
      - yingxu-data:/app/private
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
volumes:
  yingxu-data:
