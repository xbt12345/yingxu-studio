services:
  yingxu:
    build: .
    ports:
      - "127.0.0.1:8770:8770"
    environment:
      HOST: 0.0.0.0
      PORT: 8770
      CHENYU_CARD_URL: ${CHENYU_CARD_URL:-}
      YINGXU_DATA_DIR: /app/private
      YINGXU_ALLOWED_ORIGINS: ${YINGXU_ALLOWED_ORIGINS:-}
    volumes:
      - yingxu-data:/app/private
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  yingxu-data:
